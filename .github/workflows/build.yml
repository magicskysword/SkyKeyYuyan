name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - run: node scripts/build.mjs
      - run: node scripts/benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SkyKeyYuyan
          path: |
            artifacts/NuGet/*.nupkg
            artifacts/UPM/*.tgz
            artifacts/OpenUPM/*.yml
            artifacts/Reports/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkyKeyYuyan
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --draft --generate-notes release/UPM/*.tgz release/NuGet/*.nupkg release/OpenUPM/*.yml
